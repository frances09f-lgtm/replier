name: apply-settings-patch
on:
  push:
    branches: [ui/settings-cards-on-main]
    paths: ['.github/patch/**']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/patch/apply_settings_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/settings_screen.dart
          git commit -m "Make Settings card title shrink instead of overflow"
          git push
